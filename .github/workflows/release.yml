name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      - name: Verify tag, build release archive
        run: python3 scripts/build-release.py --verify-tag "$GITHUB_REF_NAME"
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum "taste-engine-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Validate discovery mirror
        run: python3 scripts/sync-agent-skills.py --check
      - name: Validate skill packs
        run: python3 skills/taste-engine/scripts/validate-pack.py
      - name: Run Python tests
        run: python3 -m unittest discover -s skills/taste-engine/tests -p 'test_*.py'
      - name: Run CLI tests
        run: node --test tests/cli.test.mjs
      - name: Publish updater-compatible archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "ERROR: Release $GITHUB_REF_NAME already exists. Aborting to prevent silent overwrite."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "dist/taste-engine-${GITHUB_REF_NAME}.zip" "dist/SHA256SUMS" --verify-tag --generate-notes --title "Taste Engine ${GITHUB_REF_NAME}"
