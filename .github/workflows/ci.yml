name: Validate Taste Engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      - name: Run shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck taste-engine/scripts/update.sh
      - name: Validate package distribution contents
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e "
            const { execSync } = require('child_process');
            const files = JSON.parse(execSync('npm pack --dry-run --json')).flatMap(p => p.files.map(f => f.path));
            if (!files.includes('docs/index.html')) throw new Error('Missing docs/index.html in npm pack');
            if (!files.includes('bin/taste-engine.mjs')) throw new Error('Missing bin/taste-engine.mjs in npm pack');
            console.log('PASS: npm pack contains docs/index.html and bin/taste-engine.mjs');
          "
      - name: Validate discovery mirror
        run: python scripts/sync-agent-skills.py --check
      - name: Validate skill packs
        run: python taste-engine/scripts/validate-pack.py
      - name: Run Python tests
        run: python -m unittest discover -s taste-engine/tests -p 'test_*.py'
        env:
          PYTHONUTF8: '1'
      - name: Run CLI tests
        run: node --test tests/cli.test.mjs
      - name: Build release ZIP
        run: python scripts/build-release.py
      - name: Verify archive integrity
        if: matrix.os == 'ubuntu-latest'
        run: unzip -t dist/taste-engine-v*.zip | tail -1
